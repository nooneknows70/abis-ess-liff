name: ABIS ESS employee correction return (synthetic only)

on:
  pull_request:
    paths:
      - '.github/workflows/employee-correction-return-ci.yml'
      - 'assets/ess-20261118-employee-correction-return/**'
      - 'tests/employee-correction-return.test.cjs'
  push:
    branches:
      - 'cursor/employee-correction-return-reason-2e56'
    paths:
      - '.github/workflows/employee-correction-return-ci.yml'
      - 'assets/ess-20261118-employee-correction-return/**'
      - 'tests/employee-correction-return.test.cjs'

permissions:
  contents: read

jobs:
  synthetic:
    name: Employee return reason
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout candidate without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse the employee overlay
        run: node --check assets/ess-20261118-employee-correction-return/employee-correction-return.js
      - name: Run synthetic employee return tests
        run: node --test tests/employee-correction-return.test.cjs
