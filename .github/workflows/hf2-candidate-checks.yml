name: HF2 candidate checks (no deploy)
on:
  push:
    branches:
      - fix/attendance-deeplink-rc1-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hf2-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check assets/ess-20261009-attendance-deeplink-hf2/attendance-deeplink-hf2.js
      - name: Hermetic regression tests
        run: node --test tests/attendance-deeplink-hf2.test.cjs
      - name: HF2 official LIFF route-token / liff.state regression checks
        run: node --test tests/hf2-liff-route-intent.test.cjs
      - name: HF2 A09701 real @144 independent LIFF probe (NO PROD DEPLOY)
        run: |
          node --check staging/hf2/v144-a09701-probe-worker.mjs
          node --test tests/hf2-v144-probe-worker.test.mjs
      - name: V144 production HF8 HOME fallback characterization (no deploy)
        run: node --test tests/hf2-v144-home-fallback-characterization.test.cjs
      - name: Phase2 LIFF staging gateway checks
        run: node --test tests/hf2-phase2-liff.test.cjs
      - name: Isolated LIFF Worker configuration safety checks
        run: node --test tests/hf2-phase2-worker.test.mjs
