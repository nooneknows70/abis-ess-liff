name: HRLB V1.1.1 adapter targeted
on:
  push:
    branches: [feat/hrlb-v1-1-1-ui-entry-20261106]
    paths:
      - assets/ess-20261106-hrlb-v1-1-ui-entry/**
      - tests/hrlb-v1-1-1/**
      - .github/workflows/hrlb-v1-1-1-ui-entry.yml
permissions:
  contents: read
jobs:
  actual-bundle-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test --test-isolation=none tests/hrlb-v1-1-1/adapter.test.cjs
