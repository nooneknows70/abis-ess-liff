<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>ABIS 員工服務</title>
  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
      color:#374151;background:#fff
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100dvh;display:grid;place-items:center;
      padding:24px;background:#fff
    }
    .wrap{text-align:center;max-width:360px;width:100%}
    .spinner{
      width:34px;height:34px;margin:0 auto 18px;border-radius:50%;
      border:3px solid #e5e7eb;border-top-color:#6b7280;
      animation:spin .8s linear infinite
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:20px;margin:0 0 8px}
    .status{font-size:15px;color:#6b7280;line-height:1.6}
    .error{color:#991b1b}
    .actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
    button,a{
      border:0;border-radius:10px;padding:11px 15px;font-size:15px;
      text-decoration:none;cursor:pointer;background:#111827;color:#fff
    }
    a{background:#eef2f7;color:#111827}
    .hide{display:none}
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <main class="wrap">
    <div id="spinner" class="spinner"></div>
    <h1>ABIS 員工服務</h1>
    <div id="status" class="status">正在開啟…</div>
    <div id="actions" class="actions hide">
      <button type="button" id="retryBtn">重新嘗試</button>
      <a id="webBtn" href="#">一般 Web 登入</a>
    </div>
  </main>

  <script>
  (() => {
    'use strict';

    const CONFIG = Object.freeze({
      liffId: '2011584842-AmO1bbHY',
      backendUrl: 'https://script.google.com/macros/s/AKfycbxWYmfVQB4DOlnz0rKPqN45IMwtIEdZ-t4GnhiS8PuxmnPX-Z46yiH-EU331X0kiweR/exec',
      bridgeVersion: 'P5A1-RM-FAST4_ROUTE_FIRST_RC1_1_TOKEN_REFRESH_20261007'
    });

    const ALLOWED_BOOT_ROUTES = new Set([
      'home','leave','leaves','attendance','payroll','inbox','account'
    ]);

    const BRIDGE_T0 = performance.now();
    const BRIDGE_EPOCH_T0 = Date.now();
    let LIFF_INIT_MS = 0;

    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');
    const actionsEl = document.getElementById('actions');
    const retryBtn = document.getElementById('retryBtn');
    const webBtn = document.getElementById('webBtn');

    webBtn.href = CONFIG.backendUrl;
    retryBtn.addEventListener('click', () => {
      if (typeof window.ABIS_FORCE_LIFF_REAUTH === 'function') {
        window.ABIS_FORCE_LIFF_REAUTH('MANUAL_RETRY');
      } else {
        location.reload();
      }
    });

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    function fail(message) {
      spinnerEl.classList.add('hide');
      setStatus(message || '無法開啟 ABIS，請重新嘗試。', true);
      actionsEl.classList.remove('hide');
    }

    function routeToken() {
      const value = new URLSearchParams(location.search).get('rt') || '';
      return /^[A-Za-z0-9._~-]{1,256}$/.test(value) ? value : '';
    }

    function bootRoute() {
      const value = String(
        new URLSearchParams(location.search).get('route') || ''
      ).trim().toLowerCase();
      return ALLOWED_BOOT_ROUTES.has(value) ? value : 'home';
    }

    function forceFullAuth() {
      return new URLSearchParams(location.search).get('force') === '1';
    }

    const REAUTH_FLAG = '__abisReauth';
    const REAUTH_SESSION_KEY = 'abis_liff_reauth_once';

    function tokenExpiryMs(idToken) {
      try {
        if (typeof liff.getDecodedIDToken === 'function') {
          const decoded = liff.getDecodedIDToken();
          const exp = Number(decoded && decoded.exp || 0);
          if (exp > 0) return exp * 1000;
        }
      } catch (ignore) {}

      try {
        const parts = String(idToken || '').split('.');
        if (parts.length < 2) return 0;
        let payload = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (payload.length % 4) payload += '=';
        const obj = JSON.parse(decodeURIComponent(Array.prototype.map.call(
          atob(payload),
          (c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
        ).join('')));
        const exp = Number(obj && obj.exp || 0);
        return exp > 0 ? exp * 1000 : 0;
      } catch (ignore) {
        return 0;
      }
    }

    function reauthRedirectUri() {
      const params = new URLSearchParams(location.search);
      const liffState = params.get('liff.state');
      const target = liffState
        ? new URL('.' + liffState, location.href)
        : new URL(location.href);
      target.searchParams.set(REAUTH_FLAG, '1');
      return target.toString();
    }

    function reauthAlreadyAttempted() {
      try {
        if (sessionStorage.getItem(REAUTH_SESSION_KEY) === '1') return true;
      } catch (ignore) {}
      return new URLSearchParams(location.search).get(REAUTH_FLAG) === '1';
    }

    function clearReauthMarker() {
      try { sessionStorage.removeItem(REAUTH_SESSION_KEY); } catch (ignore) {}
      try {
        const u = new URL(location.href);
        if (u.searchParams.has(REAUTH_FLAG)) {
          u.searchParams.delete(REAUTH_FLAG);
          history.replaceState(null, '', u.toString());
        }
      } catch (ignore) {}
    }

    function forceLiffReauth(reason) {
      if (reauthAlreadyAttempted()) {
        throw new Error(
          'LINE 登入憑證仍失效。請先更新 LINE App 後，再重新開啟此通知。'
        );
      }

      try { sessionStorage.setItem(REAUTH_SESSION_KEY, '1'); } catch (ignore) {}
      setStatus('LINE 登入已過期，正在重新驗證…', false);

      const redirectUri = reauthRedirectUri();

      try {
        if (liff.isLoggedIn()) liff.logout();
      } catch (ignore) {}

      liff.login({ redirectUri });
    }

    window.ABIS_FORCE_LIFF_REAUTH = forceLiffReauth;

    function submitToBackend(idToken, accessToken) {
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = CONFIG.backendUrl;
      form.target = '_self';
      form.acceptCharset = 'UTF-8';

      const fields = {
        mode: 'liffauth',
        idToken: idToken,
        accessToken: accessToken || '',
        routeToken: routeToken(),
        bootRoute: bootRoute(),
        forceFullAuth: forceFullAuth() ? '1' : '',
        bridgeVersion: CONFIG.bridgeVersion,
        bridgeStartedAt: String(BRIDGE_EPOCH_T0),
        bridgeElapsedMs: String(Math.max(0, Math.round(performance.now() - BRIDGE_T0))),
        liffInitMs: String(LIFF_INIT_MS)
      };

      Object.keys(fields).forEach((name) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = fields[name];
        form.appendChild(input);
      });

      document.body.appendChild(form);
      setStatus('正在進入 ABIS…', false);
      form.submit();
    }

    async function start() {
      if (!/^\d+-[A-Za-z0-9_-]+$/.test(CONFIG.liffId)) {
        fail('LIFF 設定錯誤。');
        return;
      }

      try {
        const liffT0 = performance.now();
        await liff.init({
          liffId: CONFIG.liffId,
          withLoginOnExternalBrowser: true
        });
        LIFF_INIT_MS = Math.max(0, Math.round(performance.now() - liffT0));

        if (!liff.isLoggedIn()) {
          setStatus('正在連線 LINE…', false);
          liff.login({ redirectUri: location.href });
          return;
        }

        const idToken = liff.getIDToken();
        const accessToken = liff.getAccessToken();

        if (!idToken) {
          forceLiffReauth('ID_TOKEN_UNAVAILABLE');
          return;
        }

        // Freshness check only. Identity is still verified by the backend.
        const expMs = tokenExpiryMs(idToken);
        if (expMs > 0 && expMs <= Date.now() + 60 * 1000) {
          forceLiffReauth('ID_TOKEN_EXPIRED_OR_NEAR_EXPIRY');
          return;
        }

        clearReauthMarker();

        // FAST3 is server-side. The bridge keeps no resume token/localStorage.
        // Backend decides whether the request can reuse a 5-minute cached session.
        submitToBackend(idToken, accessToken);

      } catch (err) {
        const code = err && err.code ? String(err.code) : '';
        const message = err && err.message ? String(err.message) : '';
        const safe = [code, message]
          .filter(Boolean)
          .join(' / ')
          .replace(/https?:\/\/\S+/gi, '[URL]')
          .replace(/[A-Za-z0-9_-]{24,}/g, '[redacted]')
          .slice(0,180);

        fail('無法開啟 ABIS' + (safe ? '（' + safe + '）' : '') + '。');
      }
    }

    start();
  })();
  </script>
</body>
</html>
