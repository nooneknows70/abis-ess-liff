<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>主管出勤補正確認</title>
  <style>
    body{margin:0;background:#f3f4f6;color:#1f2937}
    main{max-width:390px;margin:0 auto;padding:16px 14px 28px;box-sizing:border-box}
    .preview-note{margin:0 0 12px;color:#6b7280;font:12px/1.4 system-ui,sans-serif}
    #status{min-height:1.2em;margin:8px 0 0;font:14px/1.4 system-ui,sans-serif;color:#166534}
  </style>
</head>
<body>
  <main>
    <p class="preview-note" id="previewNote">預覽資料 · 潘淑華 B09502 · 不會送出</p>
    <div id="app"></div>
    <p id="status" role="status"></p>
  </main>
  <script src="supervisor-correction-confirm.js"></script>
  <script>
    (function () {
      var ui = window.ABIS_SUPERVISOR_CORRECTION_CONFIRM;
      var params = new URLSearchParams(location.search);
      var shot = params.get('shot') || 'grouped';
      var data = ui.fixtureB09502();
      var options = { deps: {
        sessionToken: function () { return 'preview'; },
        call: function () { return Promise.resolve({ ok: true, preview: true }); },
        message: function (text) {
          var el = document.getElementById('status');
          if (el) el.textContent = text;
        }
      }};
      if (shot === 'single' || shot === 'edit' || shot === 'reject') {
        data = Object.assign({}, data, { managerCorrections: data.managerCorrections.slice(0, 1) });
      }
      if (shot === 'hints') {
        data = Object.assign({}, data, { managerCorrections: data.managerCorrections.slice(2) });
      }
      if (shot === 'edit') options.openEditId = data.managerCorrections[0].correctionRequestId;
      if (shot === 'reject') {
        options.openReturnId = data.managerCorrections[0].correctionRequestId;
        options.returnNote = '';
      }
      if (shot === 'leave-return') {
        data = Object.assign({}, data, { managerCorrections: [data.managerCorrections[2]] });
        options.openReturnId = data.managerCorrections[0].correctionRequestId;
        options.returnNote = ui.leaveReturnNote(data.managerCorrections[0].reason);
      }
      if (shot === 'missing_fields') data = ui.fixtureMissingFields();
      var lang = (params.get('lang') || 'ZH').toUpperCase();
      if (lang === 'VI' || lang === 'TH' || lang === 'ZH' || lang === 'EN') window.currentLang = lang;
      var note = document.getElementById('previewNote');
      var notes = {
        single: '預覽 · 單筆 · 潘淑華 B09502',
        grouped: '預覽 · 同一人 4 筆 · 潘淑華 B09502',
        edit: '預覽 · 修改已展開',
        reject: '預覽 · 退回要寫原因',
        hints: '預覽 · 請假與休假日提示',
        'leave-return': '預覽 · 改申請假單，原因已帶入',
        missing_fields: '預覽 · 缺欄位 · 不能一鍵同意，也不在全部同意裡'
      };
      if (notes[shot]) note.textContent = notes[shot];
      ui.mount('#app', data, options);
    })();
  </script>
</body>
</html>
