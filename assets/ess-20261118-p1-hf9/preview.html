    function firstLineChars(el) {
      var text = el.textContent || '';
      var node = el.firstChild;
      if (!node || !text) return 0;
      var range = document.createRange();
      range.setStart(node, 0);
      range.setEnd(node, 1);
      var top = range.getBoundingClientRect().top;
      var best = 1;
      for (var i = 1; i <= text.length; i++) {
        range.setStart(node, 0);
        range.setEnd(node, i);
        var rects = range.getClientRects();
        var last = rects[rects.length - 1];
        if (!last) break;
        if (last.top > top + 1) break;
        best = i;
      }
      return best;
    }
    function linesOf(el) {
      var lh = parseFloat(getComputedStyle(el).lineHeight);
      if (!lh) return 1;
      return Math.round(el.getBoundingClientRect().height / lh);
    }
    var overflow = [];
    var vw = document.documentElement.clientWidth;
    document.querySelectorAll('.card,.wrap,.fh-quick,.notification-row,#notifications,#login,#forgotPin').forEach(function (el) {
      if (el.id === 'hf9AsyncProbe') return;
      var r = el.getBoundingClientRect();
      if (r.width < 1) return;
      if (r.right > vw + 1 || r.left < -1) overflow.push({ tag: el.id || el.className, left: Math.round(r.left), right: Math.round(r.right), vw: vw });
    });
    var titles = [];
    document.querySelectorAll('.fh-quick-copy b').forEach(function (el) {
      titles.push({ text: el.textContent, first: firstLineChars(el), lines: linesOf(el), width: Math.round(el.getBoundingClientRect().width) });
    });
    var login = document.getElementById('login');
    var loginBtn = document.getElementById('loginBtn');
    var probe = document.getElementById('hf9AsyncProbe');
    var report = {
      view: view,
      lang: lang,
      vw: vw,
      overflow: overflow,
      titles: titles,
      cardBox: login ? getComputedStyle(login).boxSizing : (document.querySelector('.card') ? getComputedStyle(document.querySelector('.card')).boxSizing : ''),
      quickDisplay: document.querySelector('.fh-quick') ? getComputedStyle(document.querySelector('.fh-quick')).flexDirection : '',
      loginColor: loginBtn ? getComputedStyle(loginBtn).color : '',
      asyncCursor: probe ? getComputedStyle(probe).cursor : '',
      asyncColor: probe ? getComputedStyle(probe).color : ''
    };
    var slot = document.getElementById('measure');
    slot.textContent = JSON.stringify(report);
  })();

</body>
